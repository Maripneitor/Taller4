version: '3.8'

services:
  usuarios_service:
    build:
      context: ./services/usuarios
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      # CAMBIO AQUÍ: Montar en la ruta anidada
      - ./services/usuarios:/app/services/usuarios
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://user:password@db:5432/usuarios_db
    depends_on:
      - db

  pedidos_service:
    build:
      context: ./services/pedidos
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    volumes:
      # CAMBIO AQUÍ: Montar en la ruta anidada
      - ./services/pedidos:/app/services/pedidos
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://user:password@db:5432/pedidos_db
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: usuarios_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
